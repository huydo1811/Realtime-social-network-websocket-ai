spring.datasource.url=jdbc:postgresql://localhost:5432/social_network_dev
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
auth.otp.code-ttl-seconds=300
auth.otp.session-ttl-seconds=900
auth.otp.max-attempts=5
auth.otp.cleanup-cron=0 0 * * * *
auth.otp.cleanup-used-days=7
auth.otp.cleanup-hard-days=30